ludus:
  - vm_name: '{{ range_id }}-dc-win2022'
    hostname: 'DC01'
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: ludus.lab
      role: primary-dc

  - vm_name: '{{ range_id }}-wsus-win2022'
    hostname: 'WSUS01'
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: ludus.lab
      role: member
    roles:
      - 5tuk0v.ludus_wsus

  - vm_name: '{{ range_id }}-win11-25h2'
    hostname: 'WS01'
    template: win11-25h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 20
    ram_gb: 8
    cpus: 4
    windows:
      sysprep: true
    domain:
      fqdn: ludus.lab
      role: member

  - vm_name: '{{ range_id }}-kali'
    hostname: 'kali'
    template: kali-x64-desktop-template
    vlan: 10
    ip_last_octet: 21
    ram_gb: 4
    cpus: 2
    linux: true
    testing:
      snapshot: false
      block_internet: false
network:
    wireguard_vlan_default: ACCEPT